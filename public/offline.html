<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#142d1c" />
    <title>ออฟไลน์ชั่วคราว · Offline · 离线</title>
    <style>
      :root {
        --bg: #0f2015;
        --card: #162d22;
        --text: #e8dfd1;
        --muted: #a0aec0;
        --accent: #e3913f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.25rem;
        background: radial-gradient(circle at 50% 0%, #1a3a24 0%, var(--bg) 70%);
        color: var(--text);
        font-family: system-ui, -apple-system, 'Segoe UI', 'Noto Sans Thai', 'Noto Sans SC', sans-serif;
        text-align: center;
      }
      .box {
        max-width: 30rem;
        width: 100%;
        background: color-mix(in srgb, var(--card) 90%, transparent);
        border: 1px solid #1e3a28;
        border-radius: 20px;
        padding: 2.5rem 1.75rem;
      }
      .icon { font-size: 3rem; line-height: 1; }
      h1 { font-size: 1.5rem; margin: 1rem 0 0.5rem; }
      p { color: var(--muted); line-height: 1.7; margin: 0 0 0.75rem; font-size: 0.95rem; }
      .btn {
        display: inline-block;
        margin-top: 1.25rem;
        padding: 0.8rem 1.6rem;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        text-decoration: none;
        font-weight: 700;
      }
      .sep { margin: 1.5rem 0; border: 0; border-top: 1px solid #1e3a28; }
      .links { font-size: 0.85rem; color: var(--muted); }
      .links a { color: var(--accent); text-decoration: none; }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="icon">♨️</div>
      <h1>น้ำพุร้อนแม่ขะจาน</h1>
      <p><strong>คุณออฟไลน์อยู่</strong> — ไม่สามารถเชื่อมต่ออินเทอร์เน็ตได้ในขณะนี้ กรุณาตรวจสอบการเชื่อมต่อแล้วลองอีกครั้ง</p>
      <p><strong>You are offline</strong> — we couldn't reach the network. Please check your connection and try again.</p>
      <p><strong>当前处于离线状态</strong> — 无法连接网络，请检查网络后重试。</p>
      <a class="btn" href="/th">ลองใหม่ · Retry</a>
      <hr class="sep" />
      <p class="links">
        <a href="/th">ไทย</a> · <a href="/en">English</a> · <a href="/zh">中文</a>
      </p>
    </div>
  </body>
</html>
